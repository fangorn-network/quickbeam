[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "quickbeam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "certifi",
    "fastapi",
    "httpx",
    "musicbrainzngs",
    "numpy",
    "psycopg[binary]",
    "qdrant-client",
    "requests",
    "tqdm",
    "typer",
    "umap-learn",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# Install one of these depending on your hardware:
#   pip install -e ".[gpu]"   — CUDA-accelerated embeddings (default for build)
#   pip install -e ".[cpu]"   — CPU-only fallback
# NOTE: `fastembed-gpu` depends on bare `onnxruntime-gpu`, which declares its CUDA and
# cuDNN wheels as OPTIONAL extras ("cuda" and "cudnn"). Without them the CUDA provider
# still registers and then dies mid-graph on the first Einsum node with
# "cuDNN is unavailable ... dlopen failed for libcudnn.so". Spelling the extras out here
# is what makes `.[gpu]` mean what it says.
gpu = ["fastembed-gpu", "onnxruntime-gpu[cuda,cudnn]"]
cpu = ["fastembed"]
# These two are mutually exclusive in practice: `fastembed` and `fastembed-gpu` both own
# the `fastembed` package directory, as do `onnxruntime` and `onnxruntime-gpu`. Installing
# one extra does NOT remove the other, so switching means uninstalling all four first —
# otherwise two onnxruntime versions land in the same directory. See gpu-env.sh.
# Agent / payments layer: MCP server (FastMCP) + x402 EIP-712 payment signing.
agent = ["fastmcp", "eth-account", "httpx"]
dev   = ["pytest", "fastmcp", "eth-account"]

[project.scripts]
quickbeam = "quickbeam.cli:app"

# Pluggable ingestion sources — quickbeam core registers NONE. Each source lives in an
# external package that adds an entry to the `quickbeam.sources` group; `discover_sources()`
# picks it up so `quickbeam data <name>` (and `quickbeam.Publisher`) work for it. See the
# `quickbeam-publisher` example project for how a source package registers itself.

[tool.setuptools.packages.find]
where = ["."]
include = ["quickbeam*"]
